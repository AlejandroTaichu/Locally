appId: com.join.app
---
- runFlow: register-and-login.yaml
- waitForAnimationToEnd
- tapOn:
    id: "create-event-fab"
- extendedWaitUntil:
    visible:
      id: "event-title-input"
    timeout: 10000
- tapOn:
    id: "event-title-input"
- inputText: "Maestro E2E Basketbol"
- pressKey: Enter
- tapOn:
    id: "category-picker-row"
- extendedWaitUntil:
    visible:
      id: "category-card-Basketbol"
    timeout: 10000
- tapOn:
    id: "category-card-Basketbol"
- tapOn:
    id: "category-save-button"
- extendedWaitUntil:
    visible:
      id: "create-event-continue-button"
    timeout: 10000
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "location-map-picker"
    timeout: 10000
- tapOn:
    id: "location-map-picker"
- scrollUntilVisible:
    element:
      id: "event-location-label-input"
    direction: DOWN
- tapOn:
    id: "event-location-label-input"
- eraseText
- inputText: "Moda Sahili Basketbol Sahası"
- pressKey: Enter
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "event-datetime-step"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "join-type-instant-button"
    timeout: 15000
- tapOn:
    id: "join-type-instant-button"
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "create-event-submit-button"
    timeout: 10000
- tapOn:
    id: "min-age-input"
- eraseText
- inputText: "18"
- tapOn: "Yaş aralığı"
- tapOn:
    id: "create-event-submit-button"
- assertVisible:
    id: "discover-heading"
