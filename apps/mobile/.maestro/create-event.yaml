appId: com.join.app
---
- runFlow: register-and-login.yaml
- waitForAnimationToEnd
- tapOn:
    id: "create-event-fab"
- extendedWaitUntil:
    visible:
      id: "event-title-input"
    timeout: 10000
- tapOn:
    id: "event-title-input"
- inputText: "Maestro E2E Basketbol"
- pressKey: Enter
- tapOn:
    id: "category-picker-row"
- extendedWaitUntil:
    visible:
      id: "category-card-Basketbol"
    timeout: 10000
- tapOn:
    id: "category-card-Basketbol"
- tapOn:
    id: "category-save-button"
- extendedWaitUntil:
    visible:
      id: "create-event-continue-button"
    timeout: 10000
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "event-location-label-input"
    timeout: 10000
- tapOn:
    id: "event-location-label-input"
- inputText: "Moda Sahili Basketbol Sahası"
- pressKey: Enter
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "event-date-row"
    timeout: 10000
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "join-type-instant-button"
    timeout: 10000
- tapOn:
    id: "join-type-instant-button"
- tapOn:
    id: "create-event-continue-button"
- extendedWaitUntil:
    visible:
      id: "create-event-submit-button"
    timeout: 10000
- tapOn:
    id: "create-event-submit-button"
- assertVisible: "Yakınındaki Aktiviteleri Keşfet"
