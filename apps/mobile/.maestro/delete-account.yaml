appId: com.join.app
---
- runFlow: register-and-login.yaml
- tapOn:
    id: "tab-profil"
- scrollUntilVisible:
    element:
      id: "profile-delete-account-row"
    direction: DOWN
- tapOn:
    id: "profile-delete-account-row"
- assertVisible: "Hesabı Kalıcı Olarak Sil"
- tapOn:
    id: "profile-delete-account-confirm-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
