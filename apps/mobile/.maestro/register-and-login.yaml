appId: com.join.app
---
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      location: inuse
- runScript: scripts/generate-test-user.js
- extendedWaitUntil:
    visible:
      id: "login-register-link"
    timeout: 25000
- tapOn:
    id: "login-register-link"
- extendedWaitUntil:
    visible:
      id: "register-name-input"
    timeout: 10000
- tapOn:
    id: "register-name-input"
- inputText: "${output.displayName}"
- tapOn:
    id: "register-email-input"
- inputText: "${output.email}"
- tapOn:
    id: "register-phone-input"
- inputText: "${output.phone}"
- pressKey: Enter
- tapOn:
    id: "register-submit-button"
- assertVisible: "Doğrulama Kodu"
- runScript: scripts/fetch-otp.js
- tapOn:
    id: "otp-code-input"
- inputText: "${output.otpCode}"
- pressKey: Enter
- tapOn:
    id: "otp-verify-button"
- tapOn:
    id: "onboarding-skip"
- assertVisible: "Yakınındaki Aktiviteleri Keşfet"
