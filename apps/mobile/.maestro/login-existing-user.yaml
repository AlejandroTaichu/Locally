appId: com.join.app
---
- runFlow: register-and-login.yaml
- tapOn:
    id: "tab-profil"
- tapOn:
    id: "profile-logout-row"
- tapOn:
    id: "profile-logout-confirm-button"
- extendedWaitUntil:
    visible:
      id: "login-target-input"
    timeout: 10000
- tapOn:
    id: "login-target-input"
- inputText: "${output.email}"
- pressKey: Enter
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "otp-code-input"
    timeout: 10000
- runScript: scripts/fetch-otp.js
- tapOn:
    id: "otp-code-input"
- inputText: "${output.otpCode}"
- pressKey: Enter
- tapOn:
    id: "otp-verify-button"
- assertVisible: "Yakınındaki Aktiviteleri Keşfet"
