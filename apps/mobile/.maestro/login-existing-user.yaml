appId: com.join.app
---
- runFlow: register-and-login.yaml
- tapOn:
    id: "tab-profil"
- tapOn:
    id: "profile-logout-row"
- tapOn:
    id: "profile-logout-confirm-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
- tapOn:
    id: "login-email-input"
- inputText: "${output.email}"
- tapOn:
    id: "login-password-input"
- inputText: "${output.password}"
- pressKey: Enter
- assertVisible:
    id: "login-submit-button"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "discover-heading"
