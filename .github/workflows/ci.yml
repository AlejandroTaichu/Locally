name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: join_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/join_app_test?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      ENABLE_TEST_ENDPOINTS: "true"
      OTP_DELIVERY_MODE: console
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter api lint

      - name: Typecheck
        run: pnpm --filter api exec tsc -p tsconfig.build.json --noEmit

      - name: Write .env.test
        working-directory: apps/api
        run: |
          cat > .env.test <<EOF
          DATABASE_URL="${DATABASE_URL}"
          JWT_SECRET="${JWT_SECRET}"
          ENABLE_TEST_ENDPOINTS="${ENABLE_TEST_ENDPOINTS}"
          OTP_DELIVERY_MODE="${OTP_DELIVERY_MODE}"
          EOF

      - name: Prisma generate
        run: pnpm --filter api exec prisma generate

      - name: Prisma migrate deploy
        run: pnpm --filter api exec prisma migrate deploy

      - name: Unit tests
        run: pnpm --filter api test

      - name: E2E tests
        run: pnpm --filter api test:e2e

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter mobile exec tsc --noEmit
